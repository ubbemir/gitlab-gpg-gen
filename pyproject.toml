[project]
name = "gitlab-gpg-gen"
version = "0.1.0"
description = "Generate a GPG key for a GitLab bot and store the private key as a masked/protected CI/CD variable on a project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pgpy>=0.6.0",
    "python-gitlab>=8.6.0",
    "requests>=2.34.2",
]

[project.scripts]
gitlab-gpg-gen = "gitlab_gpg_gen:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
